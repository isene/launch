name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: launch-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: launch-linux-aarch64

    steps:
      - uses: actions/checkout@v4
        with:
          path: launch

      - name: Checkout crust
        uses: actions/checkout@v4
        with:
          repository: isene/crust
          path: crust

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build
        working-directory: launch
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        working-directory: launch
        run: |
          cp target/${{ matrix.target }}/release/launch ../${{ matrix.artifact }}
          chmod +x ../${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Installation

            Download the binary for your platform:
            ```bash
            chmod +x launch-*
            ./launch-linux-x86_64    # or your platform
            ```

            Optionally copy to your PATH:
            ```bash
            sudo cp launch-linux-x86_64 /usr/local/bin/launch
            ```

            ## Platforms
            - `launch-linux-x86_64` - Linux (Intel/AMD 64-bit)
            - `launch-linux-aarch64` - Linux (ARM 64-bit, Raspberry Pi)

      - name: Upload the binaries, one at a time
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The upload endpoint answers 500 when several files go up at once.
          for f in artifacts/*/*; do
            for try in 1 2 3; do
              gh release upload "$GITHUB_REF_NAME" "$f" --clobber && break
              echo "upload of $f failed; waiting 10 s"
              sleep 10
            done
          done
